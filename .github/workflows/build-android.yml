name: Build MASTERME4A Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --platforms=android
      - name: Ensure Gradle plugin repositories
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path("android/settings.gradle.kts")
          if not p.exists():
              p = Path("android/settings.gradle")
          s = p.read_text()
          pattern = r"repositories\s*\{[^}]*\}"
          replacement = """repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }"""
          s, count = re.subn(pattern, lambda _: replacement, s, count=1, flags=re.S)
          if count == 0:
              raise SystemExit("Could not find existing repositories block in pluginManagement")
          p.write_text(s)
          print("Gradle plugin repositories configured")
          PY
      - name: Configure native Minecraft protocol bridge
        run: bash android-support/configure_android.sh
      - name: Fix generic MethodCall argument cast
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/example/masterme4a_bot_control/MainActivity.java')
          s = p.read_text()
          s = s.replace('String nickname = String.valueOf(call.argument("nickname")).trim();', 'Object nicknameValue = call.argument("nickname");\n                String nickname = nicknameValue == null ? "" : nicknameValue.toString().trim();')
          s = s.replace('String host = String.valueOf(call.argument("host")).trim();', 'Object hostValue = call.argument("host");\n                String host = hostValue == null ? "" : hostValue.toString().trim();')
          if 'String.valueOf(call.argument("nickname"))' in s or 'String.valueOf(call.argument("host"))' in s:
              raise SystemExit('Expected cast-prone expressions still present')
          p.write_text(s)
          PY
      - name: Disable R8 shrinking for optional MCProtocolLib classes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          if not p.exists():
              p = Path('android/app/build.gradle')
          text = p.read_text()
          if p.suffix == '.kts':
              text += '\nandroid {\n    buildTypes {\n        release {\n            isMinifyEnabled = false\n            isShrinkResources = false\n            proguardFiles.clear()\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")\n        }\n    }\n}\n'
          else:
              text += "\nandroid {\n    buildTypes {\n        release {\n            minifyEnabled false\n            shrinkResources false\n        }\n    }\n}\n"
          p.write_text(text)
          PY
      - name: Generate authentic Minecraft vanilla textures and block lookup
        run: |
          python3 -m pip install --user pillow
          python3 tools/build_minecraft_textures.py
      - name: Get dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MASTERME4A-Bot-Control-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
